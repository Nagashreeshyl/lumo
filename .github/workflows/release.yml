name: Release

# Run from the Actions tab ("Run workflow"). Builds Lumo.ipa, publishes a GitHub release,
# and updates altstore.json so SideStore shows the update on your iPhone.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, e.g. 0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: lumo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3" >&2; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already exists" >&2; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: |
          xcodegen generate --quiet
          xcodebuild test -quiet -project Lumo.xcodeproj -scheme Lumo \
            -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO

      - name: Build IPA and DMG
        run: |
          ./build_ipa.sh "${{ inputs.version }}" "${{ github.run_number }}"
          ./build_dmg.sh "${{ inputs.version }}" "${{ github.run_number }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" build/Lumo.ipa "build/Lumo-$VERSION.dmg" --title "v$VERSION" --generate-notes

      - name: Update SideStore source
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          export SIZE="$(stat -f%z build/Lumo.ipa)" DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("altstore.json")
          source = json.loads(path.read_text())
          v = os.environ["VERSION"]
          source["apps"][0]["versions"] = [{
              "version": v,
              "buildVersion": os.environ["BUILD"],
              "date": os.environ["DATE"],
              "localizedDescription": f"Lumo {v}",
              "downloadURL": f"https://github.com/{os.environ['REPO']}/releases/download/v{v}/Lumo.ipa",
              "size": int(os.environ["SIZE"]),
              "minOSVersion": "26.0",
          }]
          path.write_text(json.dumps(source, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore.json
          git commit -m "Publish v$VERSION to SideStore source [skip ci]"
          git push origin HEAD:main
